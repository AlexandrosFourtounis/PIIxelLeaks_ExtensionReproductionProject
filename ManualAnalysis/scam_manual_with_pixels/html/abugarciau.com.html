    <style type="text/css">

		#module_unavaiable{
		  	display: flex;
		    align-items: center;
		    justify-content: center;
		    height: 100vh;
		    text-align: center;
				margin: 0 auto;
		}
		#module_unavaiable .module_unavaiable_wrapper{
				width: 100%;
		}
		#module_unavaiable .logo{
			margin-bottom: 60px;
			text-transform: uppercase;
		}
    	#module_unavaiable .logo a{
		    font-size: var(--title_font_size);
		    color: var(--title_color);
		    font-family: var(--title_font_family);
		    font-style: var(--title_font_style);
		    font-weight: var(--title_font_weigth);
		    letter-spacing: var(--title_letter_spacing);
				display: inline-flex;
				align-items: center;
				line-height: 1;

		}
		#module_unavaiable .logo span{
			font-weight: bold;
		}
		#module_unavaiable .logo img{
		    max-height: 60px;
		    max-width: 300px;
		}
		#module_unavaiable .logo img.favicon{
			width: 36px;
			height: 36px;
			margin-right: 16px;
		}
		#module_unavaiable .module_unavaiable_header{
			margin-bottom: 60px;
		}
		#module_unavaiable .module_unavaiable_title{
			font-size: 24px;
			line-height: 1.3;
			color: var(--title_color);
		}
		#module_unavaiable .module_unavaiable_detail{
			margin-top: 20px;
		}
		#module_unavaiable .mo-form{
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
		}
		@media screen and (max-width: 767px){
			.module_unavaiable_default{
				padding: 0 15px;
				box-sizing: border-box;
			}
			#module_unavaiable .mo-form{
				display: inline;
			}
			#module_unavaiable .mo-form .form_btn{
			width: 100%;
			margin-left: 0;
			}
			#module_unavaiable .module_unavaiable_header,
			#module_unavaiable .logo{
				margin-bottom: 40px;
			}
			#module_unavaiable .module_unavaiable_title{
				font-size: 18px;
			}
		}
    </style>
</head>
