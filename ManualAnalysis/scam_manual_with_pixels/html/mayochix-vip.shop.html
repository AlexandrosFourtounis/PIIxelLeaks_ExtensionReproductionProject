    <style type="text/css">
    	
		#module_expired{
		  	display: flex;
		    align-items: center;
		    justify-content: center;
		    height: 100vh;
		    text-align: center;
				margin: 0 auto;
		}
		#module_expired .module_expired_wrapper{
				width: 100%;
		}
		#module_expired .logo{
			margin-bottom: 60px;
			font-size: 0;
			text-transform: uppercase;

		}
		#module_expired .logo span{
			font-weight: bold;
		}
    	#module_expired .logo a{
		    font-size: var(--title_font_size);
		    color: var(--title_color);
		    font-family: var(--title_font_family);
		    font-style: var(--title_font_style);
		    font-weight: var(--title_font_weigth);
		    letter-spacing: var(--title_letter_spacing);
				display: inline-flex;
				line-height: 1;
				align-items: center;
		}
		#module_expired .logo img{
		    max-height: 60px;
		    max-width: 300px;
		}
		#module_expired .logo img.favicon{
			width: 36px;
			height: 36px;
			margin-right: 16px;
		}
		#module_expired .module_expired_header{
			margin-bottom: 60px;
		}
		#module_expired .module_expired_title{
			font-size: 24px;
			line-height: 1.3;
			color: var(--title_color);
		}
		#module_expired .module_expired_detail{
			margin-top: 20px;
		}
		#module_expired .mo-form{
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
		}

		@media screen and (max-width: 767px){
			.module_expired_default{
				padding: 0 15px;
				box-sizing: border-box;
			}
			#module_expired .module_expired_header,
			#module_expired .logo{
				margin-bottom: 40px;
			}
			#module_expired .module_expired_title{
				font-size: 18px;
			}
		}
	
		
    </style>
</head>

			</div>
			<div class="module_expired_header">
