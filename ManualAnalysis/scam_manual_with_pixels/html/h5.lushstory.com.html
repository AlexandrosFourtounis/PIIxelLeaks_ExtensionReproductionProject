    <script>
      // 1. 从 URL 读取 fb_pixel_id 参数（示例 URL：?fb_pixel_id=123456789）
      function getFbPixelIdFromUrl() {
        const params = new URLSearchParams(window.location.search)
        return params.get('fb_pixel_id') || '' // 没有就返回空
      }

      let PIXEL_ID = getFbPixelIdFromUrl() || '1217302906963680'
      if (location.pathname.startsWith('/market/')) {
        const arr = location.pathname.split('/')
        if (arr.length === 4) {
          PIXEL_ID = arr[2]
        }
      }
      !((f, b, e, v, n, t, s) => {
        if (f.fbq) return
        n = f.fbq = (...arguments) => {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
        }
        if (!f._fbq) f._fbq = n
        n.push = n
        n.loaded = !0
        n.version = '2.0'
        n.queue = []
        t = b.createElement(e)
        t.async = !0
        t.src = v
        s = b.getElementsByTagName(e)[0]
        s.parentNode.insertBefore(t, s)
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js')
      fbq('init', PIXEL_ID)
      fbq('track', 'PageView')

      // 2. 动态创建 noscript + 像素 img
      function insertFbPixel() {
        const pixelId = getFbPixelIdFromUrl() || '1217302906963680'

        const noscript = document.createElement('noscript')
        const img = document.createElement('img')
        img.height = 1
        img.width = 1
        img.style.display = 'none'
        // 拼接像素 URL
        img.src = `https://www.facebook.com/tr?id=${pixelId}&ev=PageView&noscript=1`

        noscript.appendChild(img)
        document.body.appendChild(noscript)
      }
      window.addEventListener('DOMContentLoaded', insertFbPixel)
    </script>
